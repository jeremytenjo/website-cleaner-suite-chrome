<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 450px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
      }

      .container {
        padding: 20px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 5px;
        color: #fff;
      }

      .domain {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 15px;
      }

      .section {
        background: white;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
      }

      .section-title {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        color: #667eea;
        margin-bottom: 10px;
      }

      .input-group {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      input[type='text'] {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 13px;
        font-family: 'Monaco', 'Courier New', monospace;
      }

      input[type='text']:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      button {
        padding: 10px 16px;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover {
        background: #5568d3;
      }

      .btn-primary:active {
        transform: scale(0.98);
      }

      .btn-secondary {
        background: #f0f0f0;
        color: #666;
      }

      .btn-secondary:hover {
        background: #e0e0e0;
      }

      .selectors-list {
        border: 1px solid #eee;
        border-radius: 4px;
        max-height: 250px;
        overflow-y: auto;
        background: #fafafa;
      }

      .selector-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #eee;
        font-size: 12px;
        font-family: 'Monaco', 'Courier New', monospace;
        word-break: break-all;
      }

      .selector-item:last-child {
        border-bottom: none;
      }

      .selector-item:hover {
        background: #f0f0f0;
      }

      .selector-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        margin-left: 10px;
      }

      .selector-text {
        flex: 1;
      }

      .selector-disabled {
        opacity: 0.5;
      }

      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 36px;
        height: 20px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #ccc;
        transition: 0.2s;
        border-radius: 20px;
      }

      .toggle-slider:before {
        position: absolute;
        content: '';
        height: 16px;
        width: 16px;
        left: 2px;
        top: 2px;
        background-color: white;
        transition: 0.2s;
        border-radius: 50%;
      }

      .toggle-switch input:checked + .toggle-slider {
        background-color: #667eea;
      }

      .toggle-switch input:checked + .toggle-slider:before {
        transform: translateX(16px);
      }

      .btn-delete {
        background: #ff6b6b;
        color: white;
        padding: 4px 8px;
        font-size: 11px;
      }

      .btn-delete:hover {
        background: #ee5a52;
      }

      .empty-state {
        padding: 20px;
        text-align: center;
        color: #999;
        font-size: 13px;
      }

      .stats {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }

      .stat-box {
        flex: 1;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 12px;
        border-radius: 6px;
        text-align: center;
      }

      .stat-number {
        font-size: 20px;
        font-weight: bold;
      }

      .stat-label {
        font-size: 11px;
        opacity: 0.9;
        margin-top: 4px;
      }

      .help-text {
        font-size: 11px;
        color: #666;
        margin-top: 8px;
        padding: 8px;
        background: #f9f9f9;
        border-radius: 4px;
        border-left: 3px solid #667eea;
      }

      .section-small {
        padding: 10px 15px;
        margin-bottom: 10px;
      }

      .backup-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .backup-actions button {
        flex: 1;
      }

      .backup-status {
        margin-top: 8px;
        font-size: 12px;
        color: #666;
      }

      .backup-status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🙈 Hide Elements</h1>
      <div class="domain" id="domain">Loading...</div>

      <div class="stats">
        <div class="stat-box">
          <div class="stat-number" id="count">0</div>
          <div class="stat-label">Hidden Rules</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Add CSS Selector</div>
        <div class="input-group">
          <input
            type="text"
            id="selectorInput"
            placeholder="e.g., .ad, #banner, div.popup"
            autofocus
          />
          <button class="btn-primary" id="addBtn">Add</button>
        </div>
        <div class="help-text">
          💡 Use CSS selectors to target elements. Examples:
          <code>.classname</code>, <code>#id</code>, <code>div.ads</code>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Active Selectors</div>
        <div class="selectors-list" id="selectorsList"></div>
      </div>

      <div class="section section-small">
        <button class="btn-secondary" id="clearAllBtn" style="width: 100%">
          Clear All Hidden Elements
        </button>
        <div class="backup-actions">
          <button class="btn-secondary" id="exportBtn" type="button">Export</button>
          <button class="btn-secondary" id="importBtn" type="button">Import</button>
        </div>
        <input id="importFile" type="file" accept=".json,application/json" hidden />
        <div class="backup-status" id="backupStatus" role="status" aria-live="polite"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
