<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hide Elements</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d2825; background: #f5f3ec; }
    * { box-sizing: border-box; }
    body { width: 390px; margin: 0; font-size: 13px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    :focus-visible { outline: 2px solid #b04e36; outline-offset: 3px; }
    .masthead { padding: 23px 24px 20px; background: #1d302c; color: #f8f5ec; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { position: relative; width: 26px; height: 26px; border: 2px solid currentColor; border-radius: 3px; flex: none; }
    .brand-mark::before { content: ""; position: absolute; top: 10px; left: -5px; width: 32px; height: 3px; background: #e9a078; transform: rotate(-33deg); }
    h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.035em; }
    .site-label { margin: 23px 0 6px; color: #b8c7bf; font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .site-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .domain { overflow: hidden; font-size: 17px; font-weight: 600; letter-spacing: -.025em; text-overflow: ellipsis; white-space: nowrap; }
    .site-count { flex: none; color: #b8c7bf; font-size: 12px; }
    .site-count strong { color: #f8f5ec; font-size: 17px; font-weight: 650; }
    main { padding: 22px 24px 10px; }
    .section-heading { margin: 0 0 12px; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    .input-group { display: flex; gap: 8px; }
    #selectorInput { width: 0; min-width: 0; flex: 1; height: 40px; padding: 0 11px; border: 1px solid #bfc5bd; border-radius: 4px; background: #fffefa; color: #1d2825; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    #selectorInput::placeholder { color: #737d75; }
    #selectorInput:focus { border-color: #1d302c; outline: 2px solid #a6bcb0; outline-offset: 1px; }
    .btn-primary { min-width: 76px; height: 40px; padding: 0 11px; border: 1px solid #1d302c; border-radius: 4px; background: #1d302c; color: #fffefa; font-weight: 650; }
    .btn-primary:hover { background: #304a42; }
    .hint { margin: 9px 0 0; color: #5c6860; font-size: 11px; line-height: 1.45; }
    .hint code { color: #304a42; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .field-status { margin: 8px 0 0; color: #a23d29; font-size: 12px; line-height: 1.4; }
    .field-status:empty { display: none; }
    .rules { margin-top: 26px; }
    .rules-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid #bfc5bd; }
    .rules-head .section-heading { margin-bottom: 10px; }
    .rules-note { color: #69756c; font-size: 11px; }
    .selectors-list { max-height: 246px; overflow-y: auto; }
    .selector-item { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 9px 0; border-bottom: 1px solid #dce0d8; }
    .selector-text { flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.4; }
    .selector-disabled { color: #78827a; text-decoration: line-through; }
    .selector-actions { display: flex; align-items: center; gap: 6px; flex: none; }
    .toggle-switch { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 30px; cursor: pointer; }
    .toggle-switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .toggle-slider { position: relative; width: 30px; height: 18px; border-radius: 10px; background: #aab3a9; transition: background .15s ease; }
    .toggle-slider::before { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fffefa; transition: transform .15s ease; }
    .toggle-switch input:checked + .toggle-slider { background: #2f6552; }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(12px); }
    .toggle-switch input:focus-visible + .toggle-slider { outline: 2px solid #b04e36; outline-offset: 3px; }
    .btn-delete { padding: 6px 7px; border: 0; border-radius: 3px; background: transparent; color: #8d4937; font-size: 11px; font-weight: 600; }
    .btn-delete:hover { background: #f2e2d8; }
    .empty-state { padding: 20px 0 22px; color: #5c6860; line-height: 1.5; }
    .empty-state strong { display: block; margin-bottom: 3px; color: #1d2825; font-weight: 650; }
    .footer { padding: 16px 24px 21px; border-top: 1px solid #dce0d8; }
    .footer-label { margin: 0 0 9px; color: #5c6860; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .backup-actions { display: flex; gap: 8px; }
    .btn-secondary { flex: 1; min-height: 34px; border: 1px solid #bfc5bd; border-radius: 4px; background: #fffefa; color: #26352e; font-size: 12px; font-weight: 600; }
    .btn-secondary:hover { border-color: #6b8173; background: #e9eee6; }
    .btn-clear { flex: 1.4; color: #8d4937; }
    .backup-status { margin-top: 9px; color: #4e6155; font-size: 11px; line-height: 1.4; }
    .backup-status:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { .toggle-slider, .toggle-slider::before { transition: none; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>Hide Elements</h1></div>
    <p class="site-label">Current website</p>
    <div class="site-line"><span class="domain" id="domain">Loading…</span><span class="site-count"><strong id="count">0</strong> active</span></div>
  </header>
  <main>
    <section aria-labelledby="add-heading">
      <h2 class="section-heading" id="add-heading">Hide an element</h2>
      <div class="input-group">
        <input type="text" id="selectorInput" aria-label="CSS selector" aria-describedby="selectorHint fieldStatus" placeholder=".ad, #banner, div.popup" autofocus />
        <button class="btn-primary" id="addBtn" type="button">Add rule</button>
      </div>
      <p class="hint" id="selectorHint">Enter a CSS selector, such as <code>.ad</code> or <code>#banner</code>.</p>
      <p class="field-status" id="fieldStatus" role="status" aria-live="polite"></p>
    </section>
    <section class="rules" aria-labelledby="rules-heading">
      <div class="rules-head"><h2 class="section-heading" id="rules-heading">Rules for this website</h2><span class="rules-note" id="rulesNote"></span></div>
      <div class="selectors-list" id="selectorsList"></div>
    </section>
  </main>
  <footer class="footer">
    <p class="footer-label">Manage rules</p>
    <div class="backup-actions">
      <button class="btn-secondary" id="exportBtn" type="button">Export</button>
      <button class="btn-secondary" id="importBtn" type="button">Import</button>
      <button class="btn-secondary btn-clear" id="clearAllBtn" type="button">Clear this site</button>
    </div>
    <input id="importFile" type="file" accept=".json,application/json" hidden />
    <div class="backup-status" id="backupStatus" role="status" aria-live="polite"></div>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
